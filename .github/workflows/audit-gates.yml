name: Audit gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-provider:
    name: Go Provider / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 校验依赖完整性
        run: go mod verify
      - name: 运行测试
        run: go test ./...
      - name: 运行静态检查
        run: go vet ./...
      - name: 构建当前平台程序
        run: go build -trimpath ./cmd/v-local-key-provider
      - name: 交叉构建 Windows ARM64 Provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'arm64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -o "$env:RUNNER_TEMP/v-local-key-provider-windows-arm64.exe" ./cmd/v-local-key-provider

  race-and-fuzz:
    name: 竞态检查与解析器模糊烟测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 运行竞态检查
        run: go test -race ./...
      - name: 运行解析器模糊烟测
        run: |
          # 固定迭代量，避免计时结束时取消仍在处理大输入的工作协程，进而偶发
          # "context deadline exceeded"；真正的卡死仍由作业超时负责拦截。
          go test -run=^$ -fuzz=FuzzV4DatabaseKeyObjects -fuzztime=750000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzV4InternalXORKeys -fuzztime=750000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzScanDatabasePatterns -fuzztime=750000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzScanMediaPatterns -fuzztime=750000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzValidateRawDatabaseKey -fuzztime=50000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzValidateV4DatabasePassphrase -fuzztime=1000x -parallel=4 .
          go test -run=^$ -fuzz=FuzzInferPrefixXOR -fuzztime=750000x -parallel=4 .

  vulnerability-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 用 1.25 线的最新补丁扫描，让已修复的标准库公告自动就位，
          # 而不是把 go.mod 语言下限钉到具体补丁（那样每出新的标准库 CVE 就会中断）。
          go-version: '1.25.x'
          cache: false
      - name: 检查依赖与标准库的已知漏洞
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  npm-wrapper:
    name: npm wrapper
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 运行包装层测试
        working-directory: npm
        run: node --test tests/*.test.js
      - name: 检查发布内容
        working-directory: npm
        run: npm pack --dry-run
