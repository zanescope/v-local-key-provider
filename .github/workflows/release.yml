name: Signed release

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev.*'

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      promotion-path: ${{ steps.version.outputs.promotion-path }}
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: 验证标签、版本与测试
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          if [[ "${version}" == *-* ]]; then
            echo "npm-tag=next" >> "${GITHUB_OUTPUT}"
          else
            echo "npm-tag=latest" >> "${GITHUB_OUTPUT}"
          fi
          promotion="compatibility-evidence/promotions/${GITHUB_REF_NAME}.json"
          test -f "${promotion}"
          candidate_source="$(node npm/scripts/candidate-manifest.js promotion-source "${promotion}")"
          candidate_run_id="$(node npm/scripts/candidate-manifest.js promotion-run "${promotion}")"
          git cat-file -e "${candidate_source}^{commit}"
          git merge-base --is-ancestor "${candidate_source}" "${GITHUB_SHA}"
          unexpected="$(git diff --name-only "${candidate_source}" "${GITHUB_SHA}" -- . ':(exclude)compatibility-evidence/**')"
          test -z "${unexpected}" || { printf 'candidate 后出现了非 evidence 代码变更:\n%s\n' "${unexpected}" >&2; exit 1; }
          echo "promotion-path=${promotion}" >> "${GITHUB_OUTPUT}"
          echo "candidate-source=${candidate_source}" >> "${GITHUB_OUTPUT}"
          echo "candidate-run-id=${candidate_run_id}" >> "${GITHUB_OUTPUT}"
          go mod verify
          go test ./...
          go vet ./...
          npm --prefix npm test
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            platform="${target%/*}"
            arch="${target#*/}"
            V_LOCAL_KEY_PROVIDER_REQUIRE_RELEASE_EVIDENCE=1 \
              V_LOCAL_KEY_PROVIDER_RELEASE_TARGET="${platform}" \
              V_LOCAL_KEY_PROVIDER_RELEASE_ARCH="${arch}" \
              V_LOCAL_KEY_PROVIDER_RELEASE_EVIDENCE_DIR="${GITHUB_WORKSPACE}/compatibility-evidence" \
              V_LOCAL_KEY_PROVIDER_RELEASE_PROMOTION_PATH="${GITHUB_WORKSPACE}/${promotion}" \
              go test -count=1 -run '^TestReleaseCompatibilityEvidenceGate$' .
          done
      - name: 重新下载 promotion 指定的候选集合
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v-local-key-provider-release-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.version.outputs.candidate-run-id }}
      - name: 重新验证候选摘要与 GitHub 来源证明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE: ${{ steps.version.outputs.candidate-source }}
          CANDIDATE_RUN_ID: ${{ steps.version.outputs.candidate-run-id }}
        run: |
          node npm/scripts/candidate-manifest.js verify \
            candidate/dist/candidate-manifest.json candidate/dist windows amd64 \
            "${CANDIDATE_SOURCE}" "${CANDIDATE_RUN_ID}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml"
          candidate_assets=(
            candidate/dist/candidate-manifest.json
            candidate/dist/v-local-key-provider-windows-amd64.exe
            candidate/dist/v-local-key-provider-windows-arm64.exe
            candidate/dist/v-local-key-provider-darwin-amd64
            candidate/dist/v-local-key-provider-helper-darwin-amd64
            candidate/dist/v-local-key-provider-darwin-arm64
            candidate/dist/v-local-key-provider-helper-darwin-arm64
          )
          for asset in "${candidate_assets[@]}"; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${signer_workflow}" --source-digest "${CANDIDATE_SOURCE}"
          done

  windows:
    name: Sign Windows ${{ matrix.arch }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 导入 Authenticode 证书
        id: certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) { throw '缺少 Windows 签名证书' }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows 签名证书导入失败' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: 构建、签名并验证 Windows 发布件
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Arch '${{ matrix.arch }}' -Release `
            -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}' `
            -PromotionPath '${{ needs.validate.outputs.promotion-path }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build/windows-${{ matrix.arch }}/v-local-key-provider.exe' 'dist/v-local-key-provider-windows-${{ matrix.arch }}.exe'
          Copy-Item 'build/windows-${{ matrix.arch }}/manifest.json' 'dist/signature-manifest-windows-${{ matrix.arch }}.json'
      - name: 移除临时证书
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -LiteralPath 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -Force
      - name: 保存签名资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-provider-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Sign and notarize ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-amd64
            runner: macos-15-intel
            arch: amd64
          - name: darwin-arm64
            runner: macos-latest
            arch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 导入 Developer ID 证书
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          test -n "${CERTIFICATE_BASE64}"
          test -n "${CODESIGN_IDENTITY}"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${CERTIFICATE_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          echo "V_LOCAL_KEY_PROVIDER_CODESIGN_IDENTITY=${CODESIGN_IDENTITY}" >> "${GITHUB_ENV}"
      - name: 构建并签名 macOS 发布件
        shell: bash
        env:
          V_LOCAL_KEY_PROVIDER_RELEASE_PROMOTION_PATH: ${{ github.workspace }}/${{ needs.validate.outputs.promotion-path }}
        run: |
          scripts/build-macos.sh '${{ matrix.arch }}'
          mkdir -p dist
          cp 'build/darwin-${{ matrix.arch }}/v-local-key-provider' 'dist/v-local-key-provider-darwin-${{ matrix.arch }}'
          cp 'build/darwin-${{ matrix.arch }}/v-local-key-provider-helper' 'dist/v-local-key-provider-helper-darwin-${{ matrix.arch }}'
          stage="${RUNNER_TEMP}/provider-dmg-${{ matrix.arch }}"
          mkdir -p "${stage}"
          cp 'build/darwin-${{ matrix.arch }}/v-local-key-provider' "${stage}/v-local-key-provider"
          cp 'build/darwin-${{ matrix.arch }}/v-local-key-provider-helper' "${stage}/v-local-key-provider-helper"
          dmg="dist/v-local-key-provider-${{ matrix.name }}.dmg"
          hdiutil create -volname 'v-local-key-provider' -srcfolder "${stage}" -ov -format UDZO "${dmg}"
          codesign --force --timestamp --sign "${V_LOCAL_KEY_PROVIDER_CODESIGN_IDENTITY}" "${dmg}"
      - name: 提交 Apple notarization 并验收
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          test -n "${APPLE_ID}"
          dmg='dist/v-local-key-provider-${{ matrix.name }}.dmg'
          submission="$(xcrun notarytool submit "${dmg}" --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" --wait --output-format json)"
          submission_id="$(printf '%s' "${submission}" | plutil -extract id raw -o - -)"
          submission_status="$(printf '%s' "${submission}" | plutil -extract status raw -o - -)"
          test -n "${submission_id}"
          test "${submission_status}" = 'Accepted'
          notary_log="${RUNNER_TEMP}/notary-${{ matrix.name }}.json"
          xcrun notarytool log "${submission_id}" --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" "${notary_log}"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); bad=[i for i in d.get("issues", []) if str(i.get("severity", "")).lower() in {"warning", "error"}]; print(json.dumps(bad, ensure_ascii=False, indent=2)) if bad else None; sys.exit(1 if bad else 0)' "${notary_log}"
          xcrun stapler staple -v "${dmg}"
          xcrun stapler validate -v "${dmg}"
          codesign --verify --strict --verbose=2 "${dmg}"
          codesign --verify --strict --verbose=2 'dist/v-local-key-provider-darwin-${{ matrix.arch }}'
          codesign --verify --strict --verbose=2 'dist/v-local-key-provider-helper-darwin-${{ matrix.arch }}'
          spctl --assess --type execute --verbose=4 'dist/v-local-key-provider-darwin-${{ matrix.arch }}'
          spctl --assess --type execute --verbose=4 'dist/v-local-key-provider-helper-darwin-${{ matrix.arch }}'
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"
          cp "${notary_log}" 'dist/notary-log-${{ matrix.name }}.json'
          provider='dist/v-local-key-provider-darwin-${{ matrix.arch }}'
          helper='dist/v-local-key-provider-helper-darwin-${{ matrix.arch }}'
          provider_team="$(codesign --display --verbose=4 "${provider}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          helper_team="$(codesign --display --verbose=4 "${helper}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          provider_identifier="$(codesign --display --verbose=4 "${provider}" 2>&1 | awk -F= '/^Identifier=/{print $2; exit}')"
          helper_identifier="$(codesign --display --verbose=4 "${helper}" 2>&1 | awk -F= '/^Identifier=/{print $2; exit}')"
          test -n "${provider_team}"
          test "${provider_team}" = "${helper_team}"
          test "${provider_team}" = "${APPLE_TEAM_ID}"
          test "${provider_identifier}" = 'com.zanescope.v-local-key-provider'
          test "${helper_identifier}" = 'com.zanescope.v-local-key-provider.helper'
          provider_requirement_text="$(codesign --display --requirements - "${provider}" 2>&1 | sed -n 's/^designated => //p')"
          helper_requirement_text="$(codesign --display --requirements - "${helper}" 2>&1 | sed -n 's/^designated => //p')"
          test -n "${provider_requirement_text}"
          test -n "${helper_requirement_text}"
          printf '%s' "${provider_requirement_text}" | grep -F 'anchor apple generic' >/dev/null
          printf '%s' "${helper_requirement_text}" | grep -F 'anchor apple generic' >/dev/null
          printf '%s' "${provider_requirement_text}" | grep -F 'identifier "com.zanescope.v-local-key-provider"' >/dev/null
          printf '%s' "${helper_requirement_text}" | grep -F 'identifier "com.zanescope.v-local-key-provider.helper"' >/dev/null
          provider_requirement="$(printf '%s' "${provider_requirement_text}" | shasum -a 256 | awk '{print $1}')"
          helper_requirement="$(printf '%s' "${helper_requirement_text}" | shasum -a 256 | awk '{print $1}')"
          manifest='dist/signature-manifest-${{ matrix.name }}.json'
          plutil -create json "${manifest}"
          plutil -insert schema_version -integer 1 "${manifest}"
          plutil -insert platform -string darwin "${manifest}"
          plutil -insert arch -string '${{ matrix.arch }}' "${manifest}"
          plutil -insert build_mode -string release "${manifest}"
          plutil -insert team_id -string "${provider_team}" "${manifest}"
          plutil -insert provider_code_identifier -string "${provider_identifier}" "${manifest}"
          plutil -insert helper_code_identifier -string "${helper_identifier}" "${manifest}"
          plutil -insert runtime_signature_required -bool true "${manifest}"
          plutil -insert fixed_install_required -bool true "${manifest}"
          plutil -insert compatibility_evidence_required -bool true "${manifest}"
          plutil -insert compatibility_evidence_ready -bool true "${manifest}"
          plutil -insert compatibility_promotion_sha256 -string "$(shasum -a 256 "${V_LOCAL_KEY_PROVIDER_RELEASE_PROMOTION_PATH}" | awk '{print $1}')" "${manifest}"
          plutil -insert provider_sha256 -string "$(shasum -a 256 "${provider}" | awk '{print $1}')" "${manifest}"
          plutil -insert provider_designated_requirement_sha256 -string "${provider_requirement}" "${manifest}"
          plutil -insert helper_sha256 -string "$(shasum -a 256 "${helper}" | awk '{print $1}')" "${manifest}"
          plutil -insert helper_designated_requirement_sha256 -string "${helper_requirement}" "${manifest}"
          plutil -insert notarization_submission_id -string "${submission_id}" "${manifest}"
          plutil -insert notarization_status -string "${submission_status}" "${manifest}"
          plutil -insert stapled -bool true "${manifest}"
          plutil -insert dmg_sha256 -string "$(shasum -a 256 "${dmg}" | awk '{print $1}')" "${manifest}"
      - name: 保存签名资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-provider-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release and npm package
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: 配置 npm staged publishing 客户端
        run: npm install --global npm@11.19.0
      - name: 收集签名资产
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-provider-*
          merge-multiple: true
          path: dist
      - name: 生成并验证发布清单
        shell: bash
        run: |
          expected=(
            v-local-key-provider-windows-amd64.exe
            v-local-key-provider-windows-arm64.exe
            v-local-key-provider-darwin-amd64
            v-local-key-provider-helper-darwin-amd64
            v-local-key-provider-darwin-arm64
            v-local-key-provider-helper-darwin-arm64
          )
          : > dist/checksums.txt
          for file in "${expected[@]}"; do
            test -f "dist/${file}"
            (cd dist && sha256sum "${file}") >> dist/checksums.txt
          done
          for arch in amd64 arm64; do
            test -f "dist/v-local-key-provider-darwin-${arch}.dmg"
            test -f "dist/signature-manifest-windows-${arch}.json"
            test -f "dist/signature-manifest-darwin-${arch}.json"
            test -f "dist/notary-log-darwin-${arch}.json"
          done
          cp dist/checksums.txt npm/checksums.txt
          npm --prefix npm test
          npm --prefix npm run verify-release
          (cd npm && npm pack)
          {
            find dist -maxdepth 1 -type f ! -name release-checksums.txt -printf '%f\n' | while IFS= read -r file; do
              (cd dist && sha256sum "${file}")
            done
            for package in npm/*.tgz; do
              sha256sum "${package}" | sed 's#  npm/#  #'
            done
          } | LC_ALL=C sort -k2 > dist/release-checksums.txt
      - name: 为正式发布件生成 GitHub 来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*
            npm/*.tgz
      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq '.isPrerelease')"
            test "${is_prerelease}" = "true" || { echo '已存在的正式 Release 不能由未复验工作流覆盖' >&2; exit 1; }
            gh release upload "${GITHUB_REF_NAME}" dist/* npm/*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* npm/*.tgz --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" --prerelease
          fi
      - name: 检查 npm 首次发布状态
        id: npm-registry
        shell: bash
        run: |
          if npm view '@zanescope/v-local-key-provider' name --json >/dev/null 2>&1; then
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
            echo '::notice::npm 包尚不存在；请下载本次 Release 的 tgz，用交互式 2FA 完成首次发布，再配置 Trusted Publisher。'
          fi
      - name: 通过 npm Trusted Publishing 提交 staged publish
        if: steps.npm-registry.outputs.exists == 'true'
        shell: bash
        run: npm stage publish npm/*.tgz --access public --provenance --tag '${{ needs.validate.outputs.npm-tag }}'
